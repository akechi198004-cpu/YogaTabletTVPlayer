[package]
name = "touchiptv-desktop"
version = "1.0.0"
edition = "2021"
description = "TouchIPTV 直播桌面版：面向 Win32 低性能平板的轻量直播启动器"
license = "MIT"

[dependencies]
directories = "5.0"
eframe = { version = "0.27", default-features = false, features = ["default_fonts", "glow"] }
egui = "0.27"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "gzip", "rustls-tls"] }
rfd = "0.15"
raw-window-handle = "0.6"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
toml = "0.8"
url = "2.5"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    "Win32_System_JobObjects",
    "Win32_System_LibraryLoader",
    "Win32_System_Pipes",
    "Win32_System_Threading",
    "Win32_UI_WindowsAndMessaging",
] }

[profile.release]
# 低配平板优先控制体积，同时保留足够的运行速度。
opt-level = "s"
lto = true
codegen-units = 1
